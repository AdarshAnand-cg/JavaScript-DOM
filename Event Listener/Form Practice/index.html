    <title>Form</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <form method="get" enctype="application/x-www-form-urlencoded" autocomplete="on" action="/Event Listener/index.html" id="form">
        <fieldset>
            <legend>PERSONAL INFORMATION</legend>
            <legend>
                <label for="name">Name:-</label><input type="text" id="Name"><br><br>
                <label for="age">Age:-</label><input type="number" id="age"><br><br>
                <label for="number">Mobile Number:-</label><input type="tel" id="number"><br><br>
                <label for="gender">Gender:-</label>
                <input type="radio" id="gender" name="gender"><label for="gender">Male</label>
                <input type="radio" id="gender" name="gender"><label for="gender">Female</label><br><br>
                <input type="submit">
            </legend>
        </fieldset>
           

    </form>
